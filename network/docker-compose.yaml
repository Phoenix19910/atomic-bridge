version: "3.7"

networks:
  corridor:
    name: corridor

volumes:
  orderer.corridor.example.com:
  peer0.banka.india:
  peer0.rbi.india:
  peer0.bankc.singapore:
  peer0.mas.singapore:

services:

  # ── ORDERER ─────────────────────────────────────────────────────────────────
  orderer.corridor.example.com:
    container_name: orderer.corridor.example.com
    image: hyperledger/fabric-orderer:2.5.16
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=10050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:10053
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:10443
    working_dir: /root
    command: orderer
    volumes:
      - ./organizations/ordererOrganizations/corridor.example.com/orderers/orderer.corridor.example.com/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/corridor.example.com/orderers/orderer.corridor.example.com/tls:/var/hyperledger/orderer/tls
      - orderer.corridor.example.com:/var/hyperledger/production/orderer
    ports:
      - 10050:10050
      - 10053:10053
      - 10443:10443
    networks:
      - corridor

  # ── PEER: BankA (India) ──────────────────────────────────────────────────────
  peer0.banka.india:
    container_name: peer0.banka.india
    image: hyperledger/fabric-peer:2.5.16
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=corridor
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.banka.india
      - CORE_PEER_ADDRESS=peer0.banka.india:10051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:10051
      - CORE_PEER_CHAINCODEADDRESS=peer0.banka.india:10054
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:10054
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.banka.india:10051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.banka.india:10051
      - CORE_PEER_LOCALMSPID=BankA-MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.banka.india:10444
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - ./organizations/peerOrganizations/banka.india/peers/peer0.banka.india:/etc/hyperledger/fabric
      - ./peercfg:/etc/hyperledger/peercfg
      - peer0.banka.india:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
    command: peer node start
    ports:
      - 10051:10051
      - 10444:10444
    networks:
      - corridor

  # ── PEER: RBI (India) ────────────────────────────────────────────────────────
  peer0.rbi.india:
    container_name: peer0.rbi.india
    image: hyperledger/fabric-peer:2.5.16
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=corridor
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.rbi.india
      - CORE_PEER_ADDRESS=peer0.rbi.india:10052
      - CORE_PEER_LISTENADDRESS=0.0.0.0:10052
      - CORE_PEER_CHAINCODEADDRESS=peer0.rbi.india:10055
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:10055
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.rbi.india:10052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.rbi.india:10052
      - CORE_PEER_LOCALMSPID=RBI-MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.rbi.india:10445
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - ./organizations/peerOrganizations/rbi.india/peers/peer0.rbi.india:/etc/hyperledger/fabric
      - ./peercfg:/etc/hyperledger/peercfg
      - peer0.rbi.india:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
    command: peer node start
    ports:
      - 10052:10052
      - 10445:10445
    networks:
      - corridor

  # ── PEER: BankC (Singapore) ──────────────────────────────────────────────────
  peer0.bankc.singapore:
    container_name: peer0.bankc.singapore
    image: hyperledger/fabric-peer:2.5.16
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=corridor
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.bankc.singapore
      - CORE_PEER_ADDRESS=peer0.bankc.singapore:12051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:12051
      - CORE_PEER_CHAINCODEADDRESS=peer0.bankc.singapore:12054
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:12054
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.bankc.singapore:12051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.bankc.singapore:12051
      - CORE_PEER_LOCALMSPID=BankC-MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.bankc.singapore:12444
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - ./organizations/peerOrganizations/bankc.singapore/peers/peer0.bankc.singapore:/etc/hyperledger/fabric
      - ./peercfg:/etc/hyperledger/peercfg
      - peer0.bankc.singapore:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
    command: peer node start
    ports:
      - 12051:12051
      - 12444:12444
    networks:
      - corridor

  # ── PEER: MAS (Singapore) ────────────────────────────────────────────────────
  peer0.mas.singapore:
    container_name: peer0.mas.singapore
    image: hyperledger/fabric-peer:2.5.16
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=corridor
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.mas.singapore
      - CORE_PEER_ADDRESS=peer0.mas.singapore:12052
      - CORE_PEER_LISTENADDRESS=0.0.0.0:12052
      - CORE_PEER_CHAINCODEADDRESS=peer0.mas.singapore:12055
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:12055
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.mas.singapore:12052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.mas.singapore:12052
      - CORE_PEER_LOCALMSPID=MAS-MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.mas.singapore:12445
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - ./organizations/peerOrganizations/mas.singapore/peers/peer0.mas.singapore:/etc/hyperledger/fabric
      - ./peercfg:/etc/hyperledger/peercfg
      - peer0.mas.singapore:/var/hyperledger/production
